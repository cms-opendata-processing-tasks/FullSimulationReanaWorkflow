version: 0.9.4
inputs:
  files:
  - workflow/Snakefile
  - workflow/scripts/parse_metadata.py
  - workflow/scripts/haddnano.py
  - workflow/scripts/Stat_comparison.py
  parameters:
    # Provide the record ID of the dataset you want to simulate
    record_id: 72677 #35755
    # Provide the number of events you want the workflow to simulate
    events: 10
    # Provide the number events you want assigned to each job
    # eventsPerJob: 1
    # Provide the eos_dir you want the results to be stored in
    eos_outdir: "/eos/user/m/mtarshih/my_project"
workflow:
  file: workflow/Snakefile
  type: snakemake

  engine_args: >-
    --resources digi2raw_connections=40
  resources:
    kerberos: True
    cvmfs:
    - cms.cern.ch